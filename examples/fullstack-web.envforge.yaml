schema: envforge/v1
name: fullstack-web
description: Example full-stack web development environment.

constraints:
  userOnly: true
  allowScripts: false

tools:
  - id: git
    version: latest
  - id: node
    version: "22"
    providerPreference:
      - mise
      - winget
      - brew
      - apt
  - id: pnpm
    version: "10"
  - id: python
    version: "3.12"
  - id: go
    version: "1.24"
  - id: docker
    version: latest
    optional: true

stacks:
  - id: frontend.react
  - id: frontend.vite
  - id: backend.fastapi

env:
  PROJECT_ENV: development
  NODE_OPTIONS: --max-old-space-size=4096
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

path:
  append:
    - ./.bin

verify:
  commands:
    - git --version
    - node --version
    - pnpm --version
    - python --version
    - go version
  env:
    PROJECT_ENV: development
